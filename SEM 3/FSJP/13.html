<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Welcome Message</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7fafc;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h2 {
            color: #2d3748;
            margin-bottom: 20px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        #welcomeMessage {
            margin-top: 20px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #276749;
            padding: 12px;
            border-radius: 8px;
            background-color: #f0fff4;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome Portal</h2>
        <input type="text" id="nameInput" placeholder="Enter your name">
        <br>
        <button id="welcomeBtn">Show Welcome Message</button>
        <div id="welcomeMessage"></div>
    </div>

    <script>
        const btn = document.getElementById('welcomeBtn');
        const nameInput = document.getElementById('nameInput');
        const messageDiv = document.getElementById('welcomeMessage');

        btn.addEventListener('click', function() {
            const userName = nameInput.value.trim();
            if (userName !== "") {
                messageDiv.textContent = "Welcome to our website, " + userName + "! We are glad to have you here.";
            } else {
                messageDiv.textContent = "Welcome to our website! We are glad to have you here.";
            }
            messageDiv.style.display = "block";
        });
    </script>
</body>
</html>
